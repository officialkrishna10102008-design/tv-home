name: Build launcher APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Outfit is an open-licence (SIL OFL) typeface. If the download fails the
      # launcher falls back to the system light font, so this step may fail safely.
      - name: Download Outfit font
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/Outfit.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/outfit/Outfit%5Bwght%5D.ttf" || rm -f app/src/main/assets/Outfit.ttf

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: apple-tv-home-apk
          path: app/build/outputs/apk/debug/app-debug.apk
